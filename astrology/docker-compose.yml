# Cosmos — local / VPS deployment (docker compose up -d)
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 8000
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
